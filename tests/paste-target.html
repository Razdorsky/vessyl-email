<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local rich-text paste check</title><style>body{margin:16px;font-family:Arial;background:#fff;color:#111}#target{min-height:250px;border:1px solid #aaa;padding:8px;outline:none;box-sizing:border-box}h1{font-size:16px}pre{white-space:pre-wrap}</style></head><body><h1>Local rich-text paste check</h1><button id="paste-html" type="button">Paste HTML from clipboard</button><pre id="clipboard-state"></pre><div id="target" role="textbox" aria-label="Paste signature here" contenteditable="true"></div><pre id="summary"></pre><script>document.querySelector('#paste-html').addEventListener('click',async()=>{try{const items=await navigator.clipboard.read();const types=items.flatMap(i=>i.types);document.querySelector('#clipboard-state').textContent=JSON.stringify(types);for(const item of items){if(item.types.includes('text/html')){const html=await(await item.getType('text/html')).text();document.querySelector('#target').innerHTML=html;document.querySelector('#target').dispatchEvent(new Event('input'));return;}}}catch(error){document.querySelector('#clipboard-state').textContent=error.name+': '+error.message;}});document.querySelector('#target').addEventListener('input',()=>{const root=document.querySelector('#target');document.querySelector('#summary').textContent=JSON.stringify({tables:root.querySelectorAll('table').length,images:[...root.querySelectorAll('img')].map(x=>({src:x.getAttribute('src'),width:x.getAttribute('width'),height:x.getAttribute('height')})),links:[...root.querySelectorAll('a')].map(x=>({text:x.textContent,href:x.getAttribute('href')})),text:root.innerText},null,2)})</script></body></html>
