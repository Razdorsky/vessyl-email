<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local rich-text paste check</title>
  <style>body{margin:16px;font-family:Arial;background:#fff;color:#111}#target{min-height:250px;border:1px solid #aaa;padding:8px;outline:none;box-sizing:border-box}h1{font-size:16px}pre{white-space:pre-wrap}button{margin:0 8px 12px 0;padding:8px}</style>
</head>
<body>
  <h1>Local rich-text paste check</h1>
  <button id="paste-html" type="button">Paste HTML from clipboard</button>
  <button id="reset-color" type="button">Simulate Mail block-color reset</button>
  <pre id="clipboard-state"></pre>
  <div id="target" role="textbox" aria-label="Paste signature here" contenteditable="true"></div>
  <pre id="summary"></pre>
  <script>
    const target = document.querySelector('#target');
    function summarize() {
      document.querySelector('#summary').textContent = JSON.stringify({
        tables:target.querySelectorAll('table').length,
        images:[...target.querySelectorAll('img')].map(x=>({src:x.getAttribute('src'),width:x.getAttribute('width'),height:x.getAttribute('height')})),
        links:[...target.querySelectorAll('a')].map(x=>({text:x.textContent,href:x.getAttribute('href')})),
        textColors:[...target.querySelectorAll('p font')].map(x=>({text:x.textContent,color:getComputedStyle(x).color,fill:getComputedStyle(x).getPropertyValue('-webkit-text-fill-color')})),
        text:target.innerText,
      },null,2);
    }
    document.querySelector('#paste-html').addEventListener('click',async()=>{
      try {
        const items=await navigator.clipboard.read();
        document.querySelector('#clipboard-state').textContent=JSON.stringify(items.flatMap(i=>i.types));
        for(const item of items) if(item.types.includes('text/html')) {
          target.innerHTML=await(await item.getType('text/html')).text();
          summarize();return;
        }
      } catch(error) {document.querySelector('#clipboard-state').textContent=error.name+': '+error.message;}
    });
    document.querySelector('#reset-color').addEventListener('click',()=>{
      // A bounded failure simulation, not an iPad/UIKit emulator: reset block
      // foregrounds while preserving the direct text formatting in clipboard HTML.
      for(const el of target.querySelectorAll('table,td,p')) {
        el.style.removeProperty('-webkit-text-fill-color');
        el.style.setProperty('color','#000000','important');
      }
      summarize();
    });
    target.addEventListener('input',summarize);
  </script>
</body>
</html>
