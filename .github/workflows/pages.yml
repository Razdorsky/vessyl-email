name: Validate builder and publish legacy signature GIF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build
      - name: Stage the legacy GIF
        if: github.event_name != 'pull_request'
        run: |
          legacy_pages_dir="$RUNNER_TEMP/vessyl-signature-pages"
          mkdir -p "$legacy_pages_dir/assets"
          cp dist/assets/vessyl-signature.gif "$legacy_pages_dir/assets/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/vessyl-signature-pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
